[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hel-sbom-oss-parser"
version = "1.0.0"
description = "Generate the official SBOM / OSS-dependencies Excel deliverables from an SPDX 2.3 JSON SBOM (e.g. produced by FOSSA), and cross-check dependency versions and end-of-support dates."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
dependencies = [
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = [
    "sbom_lib",
    "sbom_to_excel",
    "sbom_to_oss_dependencies",
    "enrich_eol",
    "download_release_sbom",
]

[tool.setuptools.data-files]
"share/hel-sbom-oss-parser" = ["config/oss_deps_first_party_dependencies.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
